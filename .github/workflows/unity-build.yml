name: BaseBreak - Unity Windows Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_with_unity:
        description: "Unity lisansı GitHub Secrets içinde ayarlıysa Windows build çalıştır"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  project-check:
    name: Check Unity project structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity project files
        shell: bash
        run: |
          test -d Assets
          test -d Packages
          test -d ProjectSettings
          test -f Packages/manifest.json
          test -f ProjectSettings/EditorBuildSettings.asset
          test -f Assets/Scenes/SampleScene.unity
          echo "BaseBreak Unity project structure looks good!"

  build-windows:
    name: Build Windows executable
    needs: project-check
    if: github.event_name == 'workflow_dispatch' && inputs.build_with_unity == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.26f1
          targetPlatform: StandaloneWindows64
          buildsPath: build

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaseBreak-Windows
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14
