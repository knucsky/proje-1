name: Proje 1 - Otomatik Kontrol ve Windows Derleme

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    name: Proje 1 dosyalarını kontrol et
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity proje dosyalarını ve sahneyi kontrol et
        run: |
          test -d Assets
          test -d Packages
          test -d ProjectSettings
          test -f Assets/Scenes/SampleScene.unity
          test -f ProjectSettings/EditorBuildSettings.asset
          echo "Proje 1 dosyaları ve örnek sahne bulundu."

      - name: Unity derleme ayarlarını kontrol et
        id: license-check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity ayarları bulundu; Windows derlemesi yapılabilir."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Dosya kontrolü başarılı. Windows .exe üretmek için GitHub Secrets ayarları gerekiyor."
          fi
    outputs:
      build_ready: ${{ steps.license-check.outputs.ready }}

  build-windows:
    name: Proje 1 için Windows .exe oluştur
    needs: project-check
    if: needs.project-check.outputs.build_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity Library önbelleğini kullan
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-

      - name: Proje 1 Windows sürümünü derle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.26f1
          targetPlatform: StandaloneWindows64
          buildName: Proje1

      - name: Windows derlemesini indirilebilir dosya olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Proje-1-Windows
          path: build/StandaloneWindows64/
          if-no-files-found: error
          retention-days: 14
