name: Proje 1 - İlk Kontrol

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  project-check:
    name: Proje 1 dosyalarını kontrol et
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Unity proje klasörlerini kontrol et
        run: |
          test -d Assets
          test -d Packages
          test -d ProjectSettings
          echo "Proje 1 klasör kontrolü başarılı!"
