name: Staging -> Main otomatik Pull Request

on:
  push:
    branches:
      - Staging
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pull-request:
    name: Staging dalından main dalına PR aç
    runs-on: ubuntu-latest
    steps:
      - name: GitHub CLI ile açık PR kontrolü ve oluşturma
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --base main --head Staging --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            echo "Staging -> main için açık PR zaten var: #$existing_pr"
          else
            gh pr create \
              --base main \
              --head Staging \
              --title "Staging -> main: otomatik güncelleme" \
              --body "Bu Pull Request, Staging dalına yapılan push sonrasında otomatik oluşturuldu. Birleştirmeden önce değişiklikleri ve GitHub Actions kontrollerini inceleyin."
          fi
