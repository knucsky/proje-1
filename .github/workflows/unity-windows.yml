name: Proje 1 - Unity Windows CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    name: Check Proje 1 project structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity project files
        run: |
          test -d Assets
          test -d Packages
          test -d ProjectSettings
          test -f Assets/Scenes/SampleScene.unity
          test -f ProjectSettings/EditorBuildSettings.asset
          echo "Proje 1 project structure and sample scene are present."

  windows-build:
    name: Build Proje 1 for Windows
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unity project for Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.26f1
          targetPlatform: StandaloneWindows64
          buildName: Proje1
          buildsPath: build

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Proje-1-Windows
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14
